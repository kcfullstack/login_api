server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: auth-service

  # Default In-Memory H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Jackson JSON Serialization Settings
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Spring Security OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          # Google OAuth2 Provider
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

          # GitHub OAuth2 Provider
          github:
            client-id: ${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: GitHub

        provider:
          # Custom provider metadata can be placed here if using custom Auth servers (Keycloak/Okta)
          google:
            user-name-attribute: sub
          github:
            user-name-attribute: id

      # Resource Server JWT Validation (optional/configurable for validating bearer tokens)
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://accounts.google.com}

# SpringDoc OpenAPI / Swagger UI Settings
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.wefour.utility.auth: DEBUG
    org.springframework.security: INFO
